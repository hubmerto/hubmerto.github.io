    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap"></noscript>
    <style>
        :root {
            --bg: #000000;
            --bg-elev: #131313;
            --bg-soft: #1a1a1a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
            --hover-bg: #2b2b2b;
        }
        [data-theme="light"] {
            --bg: #f5f5f3;
            --bg-elev: #ffffff;
            --bg-soft: #ececea;
            --fg: #1a1a1a;
            --fg-strong: #000000;
            --fg-muted: #555;
            --fg-faint: #888;
            --hover-bg: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            -webkit-user-select: none;
            user-select: none;
            min-height: 100vh;
        }

        .theme-toggle {
            appearance: none; background: transparent; border: none;
            color: var(--fg); cursor: pointer; padding: 0;
            margin-left: 4px; font-size: 18px; line-height: 1;
            width: 22px; height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-toggle:hover { color: var(--fg-strong); transform: rotate(180deg); }

        .page-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 24px 32px;
            position: sticky; top: 0;
            background: var(--bg);
            z-index: 50;
        }

        nav { display: flex; gap: 24px; align-items: center; }
        nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }
        nav a:hover { color: var(--fg-strong); }
        nav a.disabled { color: var(--fg-faint); pointer-events: none; }

        main {
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 64px 12vw 160px;
        }
        main.loaded { opacity: 1; }

        /* Masonry-like grid: 12 cols, items span variably */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 96px 64px;
            grid-auto-flow: dense;
        }

        .piece {
            position: relative;
            display: block;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            cursor: pointer;
            isolation: isolate;
        }

        /* Inner box mirrors the Figma frame:
           frame 700×820, image 392×523 → ~22% horizontal / ~18% vertical inset */
        .piece-media {
            position: absolute;
            top: 18.11%; bottom: 18.11%;
            left: 22%; right: 22%;
            display: block;
            transition: opacity 0.35s ease, filter 0.35s ease;
        }
        .piece-media video, .piece-media img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }

        .piece.locked .piece-media { filter: grayscale(1); }

        /* Hover: 20% white overlay + 20px centered white outline + title */
        .piece-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background: rgba(255, 255, 255, 0.20);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }
        .piece:hover .piece-overlay { opacity: 1; }

        /* 20px stroke centered on the tile edge (10px outside / 10px inside) */
        .piece::after {
            content: '';
            position: absolute; inset: 0;
            outline: 20px solid #ffffff;
            outline-offset: -10px;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 3;
        }
        .piece:hover::after { opacity: 1; }

        .piece-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(22px, 3.4vw, 56px);
            line-height: 0.92;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--fg-strong);
            text-align: center;
            text-wrap: balance;
        }

        .piece-status {
            position: absolute; top: 12px; left: 12px;
            font-size: 10px; letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--fg-strong);
            background: rgba(0, 0, 0, 0.55);
            padding: 5px 9px; border-radius: 3px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 3;
        }
        [data-theme="light"] .piece-status { background: rgba(255,255,255,0.7); color: var(--fg-strong); }

        /* Span variants — kept narrow so pieces stay small with breathing room */
        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .span-5 { grid-column: span 5; }

        /* Every tile is a 700×820 frame by default */
        .piece { aspect-ratio: 700 / 820; }
        /* Horizontal variant: 820×700 frame, image inset matched */
        .piece.horizontal { aspect-ratio: 820 / 700; }
        .piece.horizontal .piece-media {
            top: 22%; bottom: 22%;
            left: 18.11%; right: 18.11%;
        }

        /* Sentinel for infinite scroll */
        .sentinel { grid-column: 1 / -1; height: 1px; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(6, 1fr); gap: 56px 32px; }
            .span-3 { grid-column: span 3; }
            .span-4, .span-5 { grid-column: span 4; }
            main { padding: 32px 6vw 80px; }
            .page-header { padding: 18px 16px; }
            .piece::after { outline-width: 12px; outline-offset: -6px; }
        }
        @media (max-width: 520px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 40px 16px; }
            .span-3, .span-4, .span-5 { grid-column: span 2; }
            main { padding: 24px 16px 60px; }
        }
    </style>
</head>
<body>

<header class="page-header">
    <nav>
        <a href="/">home</a>
        <a class="disabled" aria-current="page" href="/projects">projects</a>
        <a href="/contact">contact</a>
    </nav>
</header>

<main id="main">
    <div class="grid" id="grid"></div>
</main>

<script defer src="/_vercel/speed-insights/script.js"></script>
<script>
(function() {
    // Catalog: each piece = one tile. Multiple pieces per project (uses existing media).
    var catalog = [
        { project: 'Karim Boumjimar', href: '/projects/karim-boumjimar', type: 'image', src: '/projects/karim-boumjimar/media/vase.png', ar: 'tall' },
        { project: 'Emojify', href: '/projects/emojify', type: 'video', src: '/projects/emojify/media/emojisaic.mp4', mime: 'video/mp4', ar: 'landscape' },
        { project: 'Anonymous Empire', href: '/projects/anonymous-empire', type: 'video', src: '/projects/anonymous-empire/media/pile.webm', mime: 'video/webm', ar: 'square', locked: true },
        { project: 'Strelitzia', href: '/projects/strelitzia', type: 'image', src: '/projects/strelitzia/media/strelitzia-1.png', locked: true, horizontal: true }
    ];

    // Span pool — bias toward medium-large pieces, occasional small/large
    var spanPool = [3, 3, 4, 4, 5];

    function pickSpan(seedIdx) {
        // Deterministic-ish per index for consistent reflows on resize
        return spanPool[(seedIdx * 7 + 3) % spanPool.length];
    }

    function shuffled(arr, seed) {
        var a = arr.slice();
        var s = seed || 0;
        for (var i = a.length - 1; i > 0; i--) {
            s = (s * 9301 + 49297) % 233280;
            var j = Math.floor((s / 233280) * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }

    var grid = document.getElementById('grid');
    var pageCount = 0;

    function buildPiece(item, indexInPage) {
        var el;
        if (item.locked) {
            el = document.createElement('span');
            el.setAttribute('aria-disabled', 'true');
        } else {
            el = document.createElement('a');
            el.href = item.href;
        }
        el.className = 'piece span-' + pickSpan(indexInPage) + (item.locked ? ' locked' : '') + (item.horizontal ? ' horizontal' : '');

        var media = document.createElement('div');
        media.className = 'piece-media';

        var inner;
        if (item.type === 'video') {
            inner = document.createElement('video');
            inner.muted = true;
            inner.loop = true;
            inner.playsInline = true;
            inner.setAttribute('playsinline', '');
            inner.preload = 'none';
            inner.dataset.src = item.src;
            inner.dataset.mime = item.mime || 'video/mp4';
        } else {
            inner = document.createElement('img');
            inner.loading = 'lazy';
            inner.decoding = 'async';
            inner.src = item.src;
            inner.alt = item.project;
        }
        media.appendChild(inner);
        el.appendChild(media);

        if (item.locked) {
            var status = document.createElement('div');
            status.className = 'piece-status';
            status.textContent = 'Locked';
            el.appendChild(status);
        }

        var overlay = document.createElement('div');
        overlay.className = 'piece-overlay';
        var title = document.createElement('div');
        title.className = 'piece-title';
        title.textContent = item.project;
        overlay.appendChild(title);
        el.appendChild(overlay);

        return el;
    }

    function appendPage() {
        var seed = ++pageCount;
        var items = shuffled(catalog, seed);
        var frag = document.createDocumentFragment();
        items.forEach(function(item, i) {
            frag.appendChild(buildPiece(item, i + (seed - 1) * catalog.length));
        });
        // Re-insert sentinel at end
        var oldSentinel = document.getElementById('sentinel');
        if (oldSentinel) oldSentinel.remove();
        var sentinel = document.createElement('div');
        sentinel.id = 'sentinel';
        sentinel.className = 'sentinel';
        frag.appendChild(sentinel);
        grid.appendChild(frag);
        observeNewMedia();
        observeSentinel();
    }

    // Lazy video loading
    var mediaIO;
    function observeNewMedia() {
        var lazy = grid.querySelectorAll('video[data-src]');
        if (!lazy.length) return;
        if (!('IntersectionObserver' in window)) {
            lazy.forEach(function(v) { attachVideoSrc(v); });
            return;
        }
        if (!mediaIO) {
            mediaIO = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (!entry.isIntersecting) return;
                    attachVideoSrc(entry.target);
                    mediaIO.unobserve(entry.target);
                });
            }, { rootMargin: '300px' });
        }
        lazy.forEach(function(v) { mediaIO.observe(v); });
    }

    function attachVideoSrc(v) {
        if (!v.dataset.src) return;
        var src = document.createElement('source');
        src.src = v.dataset.src;
        src.type = v.dataset.mime || 'video/mp4';
        v.appendChild(src);
        v.preload = 'auto';
        v.load();
        v.addEventListener('canplay', function() { v.play().catch(function(){}); }, { once: true });
        delete v.dataset.src;
    }

    // Infinite scroll disabled — single render of the catalog.
    function observeSentinel() {}

    // Init
    var main = document.getElementById('main');
    main.offsetHeight;
    main.classList.add('loaded');
    appendPage();

    // Intra-site nav fade
    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            main.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 300);
        }
    });
})();
</script>
</body>
</html>
