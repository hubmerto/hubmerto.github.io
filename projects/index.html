    <style>
        :root {
            --bg: #000000;
            --bg-elev: #131313;
            --bg-soft: #1a1a1a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
            --hover-bg: #2b2b2b;
        }
        /* /projects is dark-only */
        [data-theme="light"] {
            --bg: #000000;
            --bg-elev: #131313;
            --bg-soft: #1a1a1a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
            --hover-bg: #2b2b2b;
        }
        .theme-toggle { display: none !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            -webkit-user-select: none;
            user-select: none;
            min-height: 100vh;
        }

        .theme-toggle {
            appearance: none; background: transparent; border: none;
            color: var(--fg); cursor: pointer; padding: 0;
            margin-left: 4px; font-size: 18px; line-height: 1;
            width: 22px; height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-toggle:hover { color: var(--fg-strong); transform: rotate(180deg); }

        .page-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 24px 32px;
            position: sticky; top: 0;
            background: var(--bg);
            z-index: 50;
        }

        nav { display: flex; gap: 24px; align-items: center; }
        nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }
        nav a:hover { color: var(--fg-strong); }
        nav a.disabled { color: var(--fg-faint); pointer-events: none; }

        main {
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 64px 12vw 160px;
        }
        main.loaded { opacity: 1; }

        /* Masonry-like grid: 12 cols, rows alternate two tiles (span 6) and three (span 4) */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 48px 32px;
            align-items: start;
        }

        .piece {
            position: relative;
            display: block;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            cursor: pointer;
            isolation: isolate;
        }

        /* Inner box mirrors the Figma frame margins (392 / 523 inside 700×820) */
        .piece-media {
            position: absolute;
            display: block;
            transition: opacity 0.35s ease, filter 0.35s ease;
        }

        /* Loader spinner: shown until media is ready */
        .piece-loader {
            position: absolute;
            top: 50%; left: 50%;
            width: 22px; height: 22px;
            margin: -11px 0 0 -11px;
            border: 2px solid var(--fg-faint);
            border-top-color: var(--fg-strong);
            border-radius: 50%;
            animation: piece-spin 0.9s linear infinite;
            opacity: 1;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 1;
        }
        .piece.media-ready .piece-loader { opacity: 0; }
        .piece-media { opacity: 0; }
        .piece.media-ready .piece-media { opacity: 1; }
        @keyframes piece-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .piece-media video, .piece-media img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }


        /* Hover: 20% white overlay + 20px centered white outline + title */
        .piece-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background: rgba(255, 255, 255, 0.20);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }
        .piece:hover .piece-overlay { opacity: 1; }

        /* 10px stroke centered on the tile edge (5px outside / 5px inside) */
        .piece::after {
            content: '';
            position: absolute; inset: 0;
            outline: 10px solid #ffffff;
            outline-offset: -5px;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 3;
        }
        .piece:hover::after { opacity: 1; }

        .piece-stack {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
            text-align: center;
        }
        .piece-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(18px, 2.4vw, 38px);
            line-height: 0.95;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--fg-strong);
            text-wrap: balance;
        }
        .piece-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(10px, 0.75vw, 12px);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--fg-strong);
        }

        .piece-status {
            position: absolute; top: 12px; left: 12px;
            font-size: 10px; letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--fg-strong);
            background: rgba(0, 0, 0, 0.55);
            padding: 5px 9px; border-radius: 3px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 3;
        }
        [data-theme="light"] .piece-status { background: rgba(255,255,255,0.7); color: var(--fg-strong); }

        /* Span variants */
        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .span-5 { grid-column: span 5; }
        .span-6 { grid-column: span 6; }
        .span-8 { grid-column: span 8; }

        /* Every tile is an 820×700 horizontal frame */
        .piece { aspect-ratio: 820 / 700; }
        .piece-media {
            top: 9%; bottom: 9%;
            left: 7.5%; right: 7.5%;
        }
        /* Vertical opt-in (700×820) for any future piece */
        .piece.vertical { aspect-ratio: 700 / 820; }
        .piece.vertical .piece-media {
            top: 7.5%; bottom: 7.5%;
            left: 9%; right: 9%;
        }
        /* Tight frame: reduce margin around image (frame hugs the image) */
        .piece.tight.vertical .piece-media {
            top: 4%; bottom: 4%;
            left: 5%; right: 5%;
        }
        .piece.tight:not(.vertical) .piece-media {
            top: 5%; bottom: 5%;
            left: 4%; right: 4%;
        }

        /* Sentinel for infinite scroll */
        .sentinel { grid-column: 1 / -1; height: 1px; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(6, 1fr); gap: 32px 20px; }
            .span-6 { grid-column: span 3; }
            .span-4 { grid-column: span 2; }
            main { padding: 32px 6vw 80px; }
            .page-header { padding: 18px 16px; }
            .piece::after { outline-width: 6px; outline-offset: -3px; }
        }
        @media (max-width: 520px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; }
            .span-3, .span-4, .span-5, .span-6, .span-8 { grid-column: span 2; }
            main { padding: 24px 16px 60px; }
        }

        /* Touch: keep tiles clean (no persistent label); just enlarge tap area. */
        @media (hover: none) {
            nav a { min-height: 44px; display: inline-flex; align-items: center; }
            .theme-toggle { width: 44px; height: 44px; }
        }
    </style>
</head>

    <div class="grid" id="grid"><!-- prerender:grid:start --><a class="piece span-6" href="/projects/karim-boumjimar"><div class="piece-loader" aria-hidden="true"></div><div class="piece-media"><img loading="lazy" decoding="async" src="/projects/karim-boumjimar/media/vase.png" alt="Karim Boumjimar"></div><div class="piece-overlay"><div class="piece-stack"><div class="piece-title">Karim<br>Boumjimar</div><div class="piece-tag">WEB</div></div></div></a><a class="piece span-6 tight" href="/projects/marie-matusz"><div class="piece-loader" aria-hidden="true"></div><div class="piece-media"><video loop muted playsinline preload="none" data-src="/projects/marie-matusz/media/marie-matusz.mp4" data-mime="video/mp4"></video></div><div class="piece-overlay"><div class="piece-stack"><div class="piece-title">Marie<br>Matusz</div><div class="piece-tag">WEB</div></div></div></a><a class="piece span-4" href="/projects/strelitzia"><div class="piece-loader" aria-hidden="true"></div><div class="piece-media"><img loading="lazy" decoding="async" src="/projects/strelitzia/media/strelitzia-1.png" alt="Strelitzia"></div><div class="piece-overlay"><div class="piece-stack"><div class="piece-title">Strelitzia</div><div class="piece-tag">3D</div></div></div></a><a class="piece span-4" href="/projects/emojify"><div class="piece-loader" aria-hidden="true"></div><div class="piece-media"><img loading="lazy" decoding="async" src="/projects/emojify/media/musik_plastikman.png" alt="Emojify"></div><div class="piece-overlay"><div class="piece-stack"><div class="piece-title">Emojify</div><div class="piece-tag">TOOL</div></div></div></a><a class="piece span-4 vertical tight" href="/projects/boiler-eggs"><div class="piece-loader" aria-hidden="true"></div><div class="piece-media"><video loop muted playsinline preload="none" data-src="/projects/boiler-eggs/media/boiler-eggs.mp4" data-mime="video/mp4"></video></div><div class="piece-overlay"><div class="piece-stack"><div class="piece-title">Boiler<br>Eggs</di <script>
(function() {
    // The tiles are pre-rendered into #grid from projects/catalog.json by
    // scripts/prerender-projects.mjs, so every project is a real <a href> in the
    // served HTML instead of appearing only once this script has run.
    // This wires up the loading state and lazy video; it builds nothing.
    var grid = document.getElementById('grid');
    var main = document.getElementById('main');

    function hydrate() {
        Array.prototype.forEach.call(grid.querySelectorAll('.piece'), function(el) {
            function markReady() { el.classList.add('media-ready'); }

            var img = el.querySelector('.piece-media img');
            if (img) {
                if (img.complete && img.naturalWidth) {
                    markReady();
                } else {
                    img.addEventListener('load', markReady, { once: true });
                    img.addEventListener('error', markReady, { once: true });
                }
            }

            var vid = el.querySelector('.piece-media video');
            if (vid) {
                vid.addEventListener('loadeddata', markReady, { once: true });
                vid.addEventListener('ended', function() { vid.currentTime = 0; vid.play().catch(function(){}); });
            }
        });
        observeMedia();
    }

    // Lazy video loading
    var mediaIO;
    function observeMedia() {
        var lazy = grid.querySelectorAll('video[data-src]');
        if (!lazy.length) return;
        if (!('IntersectionObserver' in window)) {
            Array.prototype.forEach.call(lazy, attachVideoSrc);
            return;
        }
        if (!mediaIO) {
            mediaIO = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (!entry.isIntersecting) return;
                    attachVideoSrc(entry.target);
                    mediaIO.unobserve(entry.target);
                });
            }, { rootMargin: '300px' });
        }
        Array.prototype.forEach.call(lazy, function(v) { mediaIO.observe(v); });
    }

    function attachVideoSrc(v) {
        if (!v.dataset.src) return;
        var src = document.createElement('source');
        src.src = v.dataset.src;
        src.type = v.dataset.mime || 'video/mp4';
        v.appendChild(src);
        v.preload = 'auto';
        v.load();
        v.addEventListener('canplay', function() { v.play().catch(function(){}); }, { once: true });
        delete v.dataset.src;
    }

    // Init
    main.offsetHeight;
    main.classList.add('loaded');
    hydrate();

    // Intra-site nav fade
    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            main.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 300);
        }
    });
})();
</script>
