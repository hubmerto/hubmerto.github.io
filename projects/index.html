<html lang="en">
<head>

    <meta property="og:description" content="Selected work by Humberto Gesser — including Karim Boumjimar (Berlin/Copenhagen photographer portfolio), Emojify (image-to-emoji tool), Anonymous Empire (techno visual archive), and Strelitzia (3D study).">

    <meta name="twitter:description" content="Selected work by Humberto Gesser — including Karim Boumjimar (Berlin/Copenhagen photographer portfolio), Emojify (image-to-emoji tool), Anonymous Empire (techno visual archive), and Strelitzia (3D study).">
    <meta name="twitter:image" content="https://hubmerto.com/og.png">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="canonical" href="https://hubmerto.com/projects">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"></noscript>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-elev: #131313;
            --bg-soft: #1a1a1a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
            --fg-fainter: #444;
            --border: #1a1a1a;
            --border-strong: #2a2a2a;
        }
        [data-theme="light"] {
            --bg: #f5f5f3;
            --bg-elev: #ffffff;
            --bg-soft: #ececea;
            --fg: #1a1a1a;
            --fg-strong: #000000;
            --fg-muted: #555;
            --fg-faint: #888;
            --fg-fainter: #aaa;
            --border: #e2e2e0;
            --border-strong: #d0d0ce;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            -webkit-user-select: none;
            user-select: none;
            min-height: 100vh;
        }

        .theme-toggle {
            appearance: none;
            background: transparent;
            border: none;
            color: var(--fg);
            cursor: pointer;
            padding: 0;
            margin-left: 4px;
            font-size: 18px;
            line-height: 1;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-toggle:hover { color: var(--fg-strong); transform: rotate(180deg); }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 28px 40px 0;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }
        nav a:hover { color: var(--fg-strong); }
        nav a.disabled { color: var(--fg-faint); pointer-events: none; }

        h1 {
            font-size: clamp(16px, 1.8vw, 20px);
            font-weight: 300;
            color: var(--fg-strong);
            line-height: 1.6;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .subtitle {
            font-size: clamp(13px, 1.4vw, 15px);
            color: var(--fg-muted);
            font-weight: 300;
            line-height: 1.8;
        }

        main {
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 48px 40px 80px;
        }
        main.loaded { opacity: 1; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s ease,
                        background 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-strong);
        }

        .card.locked {
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.7;
        }

        .card.locked .card-cover video,
        .card.locked .card-cover img {
            filter: grayscale(1);
        }

        .card-cover {
            aspect-ratio: 16 / 10;
            background: var(--bg-soft);
            overflow: hidden;
            position: relative;
        }

        .card-cover video,
        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .card-cover video,
        .card:hover .card-cover img {
            transform: scale(1.04);
        }

        .card-body {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--fg-strong);
            letter-spacing: 0.01em;
        }

        .card-year {
            font-size: 12px;
            color: var(--fg-faint);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .card-tags {
            font-size: 12px;
            color: var(--fg-muted);
            letter-spacing: 0.02em;
        }

        .card-status {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--fg-strong);
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 9px;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        [data-theme="light"] .card-status {
            background: rgba(255, 255, 255, 0.75);
        }

        @media (max-width: 600px) {
            .page-header { padding: 20px 20px 0; }
            main { padding: 24px 20px 60px; }
            .grid { grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
            .card-cover { aspect-ratio: 16 / 9; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div>
        <h1>Projects</h1>
        <p class="subtitle">Selected work</p>
    </div>
    <nav>
        <a href="/">home</a>
        <a class="disabled" aria-current="page" href="/projects">projects</a>
        <a href="/contact">contact</a>
    </nav>
</div>

<main id="main">
    <div class="grid">

        <a class="card" href="/projects/karim-boumjimar">
            <div class="card-cover">
                <img src="/projects/karim-boumjimar/media/karim-tornado.webp" alt="Karim Boumjimar — diamond catalog animation">
            </div>
            <div class="card-body">
                <div class="card-title-row">
                    <div class="card-title">Karim Boumjimar</div>
                    <div class="card-year">2026</div>
                </div>
                <div class="card-tags">Web · Creative direction · Engineering</div>
            </div>
        </a>

        <span class="card locked">
            <div class="card-cover">
                <video muted loop playsinline preload="none" data-lazy>
                    <source src="/projects/anonymous-empire/media/pile.webm" type="video/webm">
                </video>
                <div class="card-status">Locked</div>
            </div>
            <div class="card-body">
                <div class="card-title-row">
                    <div class="card-title">Anonymous Empire</div>
                    <div class="card-year">2026</div>
                </div>
                <div class="card-tags">Research · Design · Code</div>
            </div>
        </span>

        <span class="card locked">
            <div class="card-cover">
                <video muted loop playsinline preload="none" data-lazy>
                    <source src="/projects/strelitzia/media/VTR_06.mp4" type="video/mp4">
                </video>
                <div class="card-status">Locked</div>
            </div>
            <div class="card-body">
                <div class="card-title-row">
                    <div class="card-title">Strelitzia</div>
                    <div class="card-year">2026</div>
                </div>
                <div class="card-tags">3D · Blender</div>
            </div>
        </span>

        <a class="card" href="/projects/emojify">
            <div class="card-cover">
                <video muted loop playsinline preload="none" data-lazy>
                    <source src="/projects/emojify/media/emojisaic.mp4" type="video/mp4">
                </video>
            </div>
            <div class="card-body">
                <div class="card-title-row">
                    <div class="card-title">Emojify</div>
                    <div class="card-year">2025</div>
                </div>
                <div class="card-tags">WebGL · Creative code</div>
            </div>
        </a>

    </div>
</main>

<script defer src="/_vercel/speed-insights/script.js"></script>
<script>
(function() {
    var main = document.getElementById('main');
    main.offsetHeight;
    main.classList.add('loaded');

    var lazyVids = document.querySelectorAll('.card video[data-lazy]');
    if (lazyVids.length && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (!entry.isIntersecting) return;
                var v = entry.target;
                v.preload = 'auto';
                v.load();
                v.addEventListener('canplay', function() { v.play().catch(function(){}); }, { once: true });
                io.unobserve(v);
            });
        }, { rootMargin: '300px' });
        lazyVids.forEach(function(v) { io.observe(v); });
    } else {
        lazyVids.forEach(function(v) { v.preload = 'auto'; v.load(); v.play().catch(function(){}); });
    }

    document.querySelectorAll('a[href]').forEach(function(a) {
        a.addEventListener('click', function(e) {
            var href = a.getAttribute('href');
            if (href.startsWith('/') || href.startsWith('./')) {
                e.preventDefault();
                main.style.opacity = '0';
                setTimeout(function() { window.location.href = href; }, 350);
            }
        });
    });
})();
</script>
</body>
</html>
