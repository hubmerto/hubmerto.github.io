    <style>

        
        :root {
            --bg: #0a0a0a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
        }
        [data-theme="light"] {
            --bg: #f5f5f3;
            --fg: #1a1a1a;
            --fg-strong: #000000;
            --fg-muted: #555;
            --fg-faint: #888;
        }
        .bg-video, .bg-video + * { z-index: 0; }
        [data-theme="light"] .bg-video { display: none; }
        .theme-toggle {
            appearance: none; background: transparent; border: none;
            color: var(--fg); cursor: pointer; padding: 0;
            margin-left: 4px; font-size: 18px; line-height: 1;
            width: 22px; height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-toggle:hover { color: var(--fg-strong); transform: rotate(180deg); }
* { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .content {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
        }

        nav {
            display: flex;
            gap: 24px;
            background: transparent;
        }

        nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--fg-strong);
        }

        nav a.disabled {
            color: var(--fg-faint);
            pointer-events: none;
        }

        /* Main content */
        main {
            padding: 0;
            max-width: 800px;
        }

        h1 {
            font-size: clamp(16px, 1.8vw, 20px);
            font-weight: 300;
            color: var(--fg-strong);
            line-height: 1.6;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .subtitle {
            font-size: clamp(13px, 1.4vw, 15px);
            color: var(--fg-muted);
            font-weight: 300;
            margin-bottom: 48px;
            line-height: 1.8;
        }

        /* Projects list */
        .project-item {
            margin-bottom: 32px;
        }

        .project-name {
            position: relative;
            display: inline-flex;
            align-items: center;
            font-size: clamp(14px, 1.6vw, 17px);
            color: var(--fg);
            text-decoration: none;
            padding: 4px 8px;
            margin-left: -8px;
            border-radius: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        a.project-name {
            cursor: pointer;
        }

        a.project-name:hover {
            background-color: var(--fg-strong);
            color: var(--bg);
        }

        .project-name.locked {
            color: var(--fg-faint);
            cursor: not-allowed;
            pointer-events: none;
        }

        .project-name.locked::after {
            content: " · locked";
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--fg-fainter);
            margin-left: 8px;
        }

        .project-desc {
            font-size: clamp(12px, 1.4vw, 14px);
            color: var(--fg-faint);
            line-height: 1.8;
            padding-left: 8px;
        }

        .project-tag {
            display: inline-block;
            font-size: 11px;
            color: var(--fg-faint);
            letter-spacing: 0.05em;
            margin-left: 8px;
        }


        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            .page-header { padding: 18px 20px; }
            main { padding: 0; }
            nav { gap: 16px; }
        }
    </style>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline preload="auto" poster="/projects/poster.jpg">
    <source src="/projects/bg.mp4" type="video/mp4">
</video>

<div class="content" id="content">
<div class="page-header">
<main>
    <h1>Projects</h1>
    <p class="subtitle">Selected work</p>

    <div class="project-item">
        <a class="project-name" href="/projects/karim-boumjimar">Karim Boumjimar</a>
    </div>

    <div class="project-item">
        <span class="project-name locked">Anonymous Empire</span>
    </div>

    <div class="project-item">
        <span class="project-name locked">Strelitzia</span>
    </div>

    <div class="project-item">
        <a class="project-name" href="/projects/emojify">Emojify</a>
    </div>

</main>

<nav>
    <a href="/">home</a>
    <a class="disabled" href="/projects">projects</a>
    <a href="/contact">contact</a>
</nav>
</div>
</div>

<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('dblclick', function(e) { e.preventDefault(); });
var content = document.getElementById('content');
content.offsetHeight;
content.style.opacity = '1';
document.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            content.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 400);
        }
    });
});
(function() {
    var video = document.querySelector('.bg-video');
    function tryPlay() {
        video.play().catch(function() {});
    }
    if (video.readyState >= 3) {
        tryPlay();
    } else {
        video.addEventListener('canplay', tryPlay, { once: true });
    }
    // Fallback: keep retrying every 500ms until playing
    var check = setInterval(function() {
        if (!video.paused) { clearInterval(check); return; }
        tryPlay();
    }, 500);
    setTimeout(function() { clearInterval(check); }, 10000);
})();
</script>

</body>
</html>
