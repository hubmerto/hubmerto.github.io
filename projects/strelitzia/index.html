<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hubmerto.strelitzia</title>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
    <link rel="prefetch" href="/ascii-frames.json" as="fetch" type="application/json" crossorigin>
    <link rel="prefetch" href="/bg.mp4" as="video" type="video/mp4">
    <link rel="prefetch" href="/projects/bg.mp4" as="video" type="video/mp4">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-header {
            padding: 24px 40px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0;
        }

        nav {
            display: flex;
            gap: 24px;
            background: transparent;
            flex-shrink: 0;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.disabled {
            color: #555;
            pointer-events: none;
        }

        main {
            padding: 0;
            max-width: 900px;
        }

        h1 {
            font-size: clamp(18px, 2.2vw, 24px);
            font-weight: 300;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .tags {
            font-size: clamp(13px, 1.5vw, 16px);
            color: #555;
            font-weight: 300;
            margin-bottom: 32px;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: clamp(14px, 1.8vw, 19px);
            color: #888;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 48px;
        }

        .project-video {
            width: 100%;
            max-width: 900px;
            margin-bottom: 48px;
        }

        .project-video video {
            width: 100%;
            display: block;
            border-radius: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 48px;
        }

        .video-grid video {
            width: 100%;
            display: block;
            object-fit: cover;
            aspect-ratio: 1;
        }

        .context {
            font-size: clamp(14px, 1.6vw, 17px);
            color: #777;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 48px;
        }

        .spacer {
            height: 80px;
        }

        @media (max-width: 600px) {
            .page-header {
                padding: 18px 16px;
            }
            nav {
                gap: 12px;
            }
            nav a {
                font-size: 12px;
            }
            main {
                padding: 0;
                max-width: 100%;
            }
            .description, .context {
                font-size: 14px;
            }
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>


<div class="page-header">
    <div class="title-row">
        <div>
            <h1>Strelitzia</h1>
            <p class="tags">3d, blender</p>
        </div>
        <nav>
            <a href="/">home</a>
            <a href="/projects">projects</a>
            <a href="/contact">contact</a>
        </nav>
    </div>

    <main>
        <p class="description">
            A study of the bird of paradise flower rendered in Blender. Rigid botanical geometry meets metallic materiality — dark sepals and golden petals treated as sculptural surfaces rather than organic forms.
        </p>

        <div class="project-video">
            <video autoplay muted loop playsinline>
                <source src="VTR_06.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-grid">
            <video autoplay muted loop playsinline>
                <source src="VTR_02.mp4" type="video/mp4">
            </video>
            <video autoplay muted loop playsinline>
                <source src="VTR_04.mp4" type="video/mp4">
            </video>
        </div>

        <div class="project-video">
            <video autoplay muted loop playsinline>
                <source src="VTR_10.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-grid">
            <video autoplay muted loop playsinline>
                <source src="VTR_unnamed.mp4" type="video/mp4">
            </video>
            <video autoplay muted loop playsinline style="background:#0a0a0a;">
                <source src="VTR_02.mp4" type="video/mp4">
            </video>
        </div>

        <div class="spacer"></div>
    </main>
</div>


<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('dblclick', function(e) { e.preventDefault(); });
document.body.offsetHeight;
document.body.style.opacity = '1';
document.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 400);
        }
    });
});
</script>

</body>
</html>
