<script>
(function() {
    var canvas = document.getElementById('ascii-canvas');
    var ctx = canvas.getContext('2d');
    var loader = document.getElementById('loader');
    var nav = document.getElementById('nav');
    var visited = sessionStorage.getItem('visited');
    var ASCII = ' .·:;~!¡†‡*+≠#%▓@█';
    var frameData = null;
    var currentFrame = 0;
    var animInterval = null;

    sessionStorage.setItem('visited', '1');

    // Start loading bar if first visit
    var progress = 0;
    var loadInterval = null;
    if (!visited) {
        loadInterval = setInterval(function() {
            progress += (90 - progress) * 0.08;
            loader.style.width = progress + '%';
        }, 50);
    } else {
        loader.style.display = 'none';
    }

    function reveal() {
        if (loadInterval) clearInterval(loadInterval);
        if (!visited) {
            loader.style.width = '100%';
            setTimeout(function() {
                loader.classList.add('done');
                canvas.classList.add('loaded');
                nav.classList.add('loaded');
            }, 300);
        } else {
            canvas.classList.add('loaded');
            nav.classList.add('loaded');
        }
    }

    function isPortraitMobile() {
        return window.innerWidth < 700 && window.innerHeight > window.innerWidth;
    }

    function setupCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var rotate = isPortraitMobile();
        var logicalW = rotate ? window.innerHeight : window.innerWidth;
        var logicalH = rotate ? window.innerWidth : window.innerHeight;
        canvas.width = logicalW * dpr;
        canvas.height = logicalH * dpr;
        canvas.style.width = logicalW + 'px';
        canvas.style.height = logicalH + 'px';
        if (rotate) {
            canvas.style.position = 'fixed';
            canvas.style.top = '50%';
            canvas.style.left = '50%';
            canvas.style.transform = 'translate(-50%, -50%) rotate(90deg)';
            canvas.style.transformOrigin = 'center center';
        } else {
            canvas.style.position = '';
            canvas.style.top = '';
            canvas.style.left = '';
            canvas.style.transform = '';
            canvas.style.transformOrigin = '';
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Measure monospace char aspect ratio once
    var charRatio = 0.6; // width/height for monospace fonts

    // Mouse tracking
    var mouseX = -9999, mouseY = -9999;
    var magnifyRadius = 150; // px radius of zoom lens
    var magnifyScale = 2.2; // max font scale at center

    // Ripple wave effect
    var ripples = [];
    var rippleSpeed = 350; // px per second
    var rippleWidth = 100; // thickness of the wave ring
    var rippleStrength = 40; // max displacement in px
    var rippleMaxRadius = 800; // ripple dies after this radius

    // Explosion — chars fly out then snap back
    var explosions = [];
    var EXPLOSION_RADIUS = 160; // px area of effect
    var EXPLOSION_STRENGTH = 60; // max displacement
    var EXPLOSION_LIFE = 800; // ms total

    canvas.addEventListener('click', function(e) {
        ripples.push({
            x: e.clientX,
            y: e.clientY,
            birth: Date.now(),
            radius: 0
        });
        explosions.push({
            x: e.clientX,
            y: e.clientY,
            birth: Date.now()
        });
    });

    // Track mouse + spawn ripples (throttled)
    var lastRippleTime = 0;
    document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        var now = Date.now();
        if (now - lastRippleTime > 300) {
            lastRippleTime = now;
            ripples.push({
                x: e.clientX,
                y: e.clientY,
                birth: now,
                radius: 0
            });
        }
    });
    document.addEventListener('mouseleave', function() {
        mouseX = -9999;
        mouseY = -9999;
    });

    function updateRipples() {
        var now = Date.now();
        for (var i = ripples.length - 1; i >= 0; i--) {
            ripples[i].radius = (now - ripples[i].birth) / 1000 * rippleSpeed;
            if (ripples[i].radius > rippleMaxRadius) {
                ripples.splice(i, 1);
            }
        }
    }

    function getRippleDisplacement(px, py) {
        var totalDx = 0, totalDy = 0;
        for (var i = 0; i < ripples.length; i++) {
            var r = ripples[i];
            var dx = px - r.x;
            var dy = py - r.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 1) continue;

            // How far is this point from the ripple ring?
            var distFromRing = Math.abs(dist - r.radius);
            if (distFromRing > rippleWidth) continue;

            // Wave shape: smooth bump
            var wave = 1 - distFromRing / rippleWidth;
            wave = wave * wave * (3 - 2 * wave); // smoothstep

            // Fade out as ripple expands
            var fade = 1 - r.radius / rippleMaxRadius;
            fade = fade * fade;

            var strength = wave * fade * rippleStrength;
            var nx = dx / dist;
            var ny = dy / dist;
            totalDx += nx * strength;
            totalDy += ny * strength;
        }
        return [totalDx, totalDy];
    }

    function drawFrame(idx) {
        if (!frameData) return;
        var w = canvas.clientWidth || window.innerWidth;
        var h = canvas.clientHeight || window.innerHeight;
        var dataCols = frameData.cols;
        var dataRows = frameData.rows;

        updateRipples();

        // Clear full canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        // Lock aspect ratio
        var gridAspect = (dataCols * charRatio) / dataRows;

        var fontSize;
        if (w / h > gridAspect) {
            fontSize = w / (dataCols * charRatio);
        } else {
            fontSize = h / dataRows;
        }

        var charW = fontSize * charRatio;
        var charH = fontSize;
        var gridW = dataCols * charW;
        var gridH = dataRows * charH;
        var offsetX = (w - gridW) / 2;
        var offsetY = (h - gridH) / 2;

        var baseFont = fontSize + 'px Menlo,Monaco,Courier New,monospace';
        var lastFont = baseFont;
        ctx.font = baseFont;
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#e0e0e0';

        var frame = frameData.frames[idx];
        var hasRipples = ripples.length > 0;
        var hasExplosions = explosions.length > 0;
        var hasMouse = mouseX > -9000;
        var magR2 = magnifyRadius * magnifyRadius;
        var expR2 = EXPLOSION_RADIUS * EXPLOSION_RADIUS;
        var now = Date.now();

        for (var y = 0; y < dataRows; y++) {
            var baseY = offsetY + y * charH;

            // Check if row needs per-char drawing
            var rowHasRipple = false;
            if (hasRipples) {
                for (var ri = 0; ri < ripples.length; ri++) {
                    var rDy = Math.abs(baseY - ripples[ri].y);
                    if (rDy < ripples[ri].radius + rippleWidth) {
                        rowHasRipple = true;
                        break;
                    }
                }
            }
            var rowHasExplosion = false;
            if (hasExplosions) {
                for (var ei = 0; ei < explosions.length; ei++) {
                    if (Math.abs(baseY - explosions[ei].y) < EXPLOSION_RADIUS + EXPLOSION_STRENGTH) {
                        rowHasExplosion = true;
                        break;
                    }
                }
            }
            var rowHasMagnify = hasMouse && Math.abs(baseY - mouseY) < magnifyRadius + charH;
            var needsPerChar = rowHasRipple || rowHasMagnify || rowHasExplosion;

            if (!needsPerChar) {
                // Fast path — draw whole line
                if (lastFont !== baseFont) { ctx.font = baseFont; lastFont = baseFont; }
                var line = '';
                for (var x = 0; x < dataCols; x++) {
                    var c = frame[y * dataCols + x];
                    var charIdx = c >= 'a' ? (c.charCodeAt(0) - 87) : parseInt(c);
                    line += ASCII[charIdx];
                }
                ctx.fillText(line, offsetX, baseY);
            } else {
                // Per-char path — ripple + magnify
                for (var x = 0; x < dataCols; x++) {
                    var cx = offsetX + x * charW;
                    var cy = baseY;

                    var c = frame[y * dataCols + x];
                    var charIdx = c >= 'a' ? (c.charCodeAt(0) - 87) : parseInt(c);
                    var ch = ASCII[charIdx];

                    // Ripple displacement
                    if (rowHasRipple) {
                        var disp = getRippleDisplacement(cx, cy);
                        cx += disp[0];
                        cy += disp[1];
                    }

                    // Explosion: fly out then snap back
                    if (rowHasExplosion) {
                        for (var ei = 0; ei < explosions.length; ei++) {
                            var exp = explosions[ei];
                            var edx = cx - exp.x;
                            var edy = cy - exp.y;
                            var ed2 = edx * edx + edy * edy;
                            if (ed2 < expR2 && ed2 > 0) {
                                var ed = Math.sqrt(ed2);
                                var et = (now - exp.birth) / EXPLOSION_LIFE;
                                // Ease: quick out, slow back — using sin curve
                                var wave = Math.sin(et * Math.PI);
                                var proximity = 1 - ed / EXPLOSION_RADIUS;
                                proximity = proximity * proximity;
                                var push = wave * proximity * EXPLOSION_STRENGTH;
                                cx += (edx / ed) * push;
                                cy += (edy / ed) * push;
                            }
                        }
                    }

                    // Magnify effect
                    var scale = 1;
                    if (hasMouse) {
                        var mdx = cx - mouseX;
                        var mdy = cy - mouseY;
                        var md2 = mdx * mdx + mdy * mdy;
                        if (md2 < magR2) {
                            var md = Math.sqrt(md2);
                            var mt = 1 - md / magnifyRadius;
                            mt = mt * mt * (3 - 2 * mt); // smoothstep
                            scale = 1 + (magnifyScale - 1) * mt;
                        }
                    }

                    if (scale > 1.01) {
                        var scaledSize = fontSize * scale;
                        var sf = scaledSize + 'px Menlo,Monaco,Courier New,monospace';
                        if (lastFont !== sf) { ctx.font = sf; lastFont = sf; }
                        var sx = cx - (scaledSize * charRatio - charW) * 0.5;
                        var sy = cy - (scaledSize - charH) * 0.5;
                        ctx.fillText(ch, sx, sy);
                    } else {
                        if (lastFont !== baseFont) { ctx.font = baseFont; lastFont = baseFont; }
                        ctx.fillText(ch, cx, cy);
                    }
                }
            }
        }

        // Clean up expired explosions
        var now = Date.now();
        for (var ei = explosions.length - 1; ei >= 0; ei--) {
            if (now - explosions[ei].birth > EXPLOSION_LIFE) {
                explosions.splice(ei, 1);
            }
        }
    }

    function startAnimation() {
        var totalFrames = frameData.frames.length;
        var msPerFrame = frameData.fps;
        var totalDuration = totalFrames * msPerFrame;

        // Sync to time so all pages feel continuous
        currentFrame = Math.floor(((Date.now()) % totalDuration) / msPerFrame);
        drawFrame(currentFrame);
        reveal();

        function tick() {
            currentFrame = Math.floor(((Date.now()) % totalDuration) / msPerFrame);
            drawFrame(currentFrame);
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    setupCanvas();
    window.addEventListener('resize', function() {
        setupCanvas();
        if (frameData) drawFrame(currentFrame);
    });

    fetch('/ascii-frames.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            frameData = data;
            startAnimation();
        })
        .catch(function() {
            // Fallback: just show nav
            reveal();
        });

    // Timeout fallback
    setTimeout(function() {
        if (!frameData) reveal();
    }, 8000);
})();
document.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            document.getElementById('nav').style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 400);
        }
    });
});
</script>
