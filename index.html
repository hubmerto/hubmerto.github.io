<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hubmerto</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            background: transparent;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ff0022;
        }

        nav a.disabled {
            color: #555;
            pointer-events: none;
            cursor: default;
        }

        #ascii {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: 'Space Grotesk', monospace;
            font-size: 8px;
            line-height: 0.95;
            letter-spacing: 0.02em;
            color: #e0e0e0;
            white-space: pre;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
        }

        video, canvas { display: none; }

        @media (max-width: 600px) {
            nav { padding: 18px 20px; }
            #ascii { font-size: 6px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/projects" class="disabled">projects</a>
    <a href="/contact">contact</a>
</nav>

<video id="video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
</video>
<canvas id="sampleCanvas"></canvas>
<div id="ascii"></div>

<script>
(function() {
    var video = document.getElementById('video');
    var sampleCanvas = document.getElementById('sampleCanvas');
    var ctx = sampleCanvas.getContext('2d');
    var asciiEl = document.getElementById('ascii');

    // ASCII characters from dark to light (extended ramp for more tonal detail)
    var chars = '  ..,::;;++**??%%SS##@@';

    // Mouse tracking
    var mouse = { x: -1, y: -1 };
    var mouseRadius = 12; // radius of influence in grid cells

    document.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    document.addEventListener('mouseleave', function() {
        mouse.x = -1;
        mouse.y = -1;
    });

    // Calculate grid dimensions based on window size
    function getGridSize() {
        var charW = 5.2;  // approximate char width at 8px font
        var charH = 7.6;  // approximate char height at 8px font
        if (window.innerWidth <= 600) {
            charW = 3.2;
            charH = 4.8;
        }
        var cols = Math.floor(window.innerWidth / charW);
        var rows = Math.floor(window.innerHeight / charH);
        return { cols: cols, rows: rows, charW: charW, charH: charH };
    }

    var grid = getGridSize();

    window.addEventListener('resize', function() {
        grid = getGridSize();
    });

    function renderFrame() {
        if (video.readyState < 2) {
            requestAnimationFrame(renderFrame);
            return;
        }

        var cols = grid.cols;
        var rows = grid.rows;

        sampleCanvas.width = cols;
        sampleCanvas.height = rows;

        // Draw video frame scaled to grid size
        ctx.drawImage(video, 0, 0, cols, rows);
        var imageData = ctx.getImageData(0, 0, cols, rows);
        var pixels = imageData.data;

        // Convert mouse position to grid coordinates
        var mx = grid.charW > 0 ? mouse.x / grid.charW : -1;
        var my = grid.charH > 0 ? mouse.y / grid.charH : -1;

        // Build a displacement map for mouse interaction
        var displaceX = new Float32Array(cols * rows);
        var displaceY = new Float32Array(cols * rows);

        if (mouse.x >= 0 && mouse.y >= 0) {
            for (var y = 0; y < rows; y++) {
                for (var x = 0; x < cols; x++) {
                    var dx = x - mx;
                    var dy = y - my;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouseRadius && dist > 0.1) {
                        var influence = (1 - dist / mouseRadius);
                        influence = influence * influence; // ease
                        var pushStrength = influence * 6;
                        var i = y * cols + x;
                        displaceX[i] = (dx / dist) * pushStrength;
                        displaceY[i] = (dy / dist) * pushStrength;
                    }
                }
            }
        }

        var output = '';
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                var i = y * cols + x;

                // Sample from displaced position (pull from where this char was pushed from)
                var srcX = Math.round(x - displaceX[i]);
                var srcY = Math.round(y - displaceY[i]);

                // Clamp
                srcX = Math.max(0, Math.min(cols - 1, srcX));
                srcY = Math.max(0, Math.min(rows - 1, srcY));

                var idx = (srcY * cols + srcX) * 4;
                var r = pixels[idx];
                var g = pixels[idx + 1];
                var b = pixels[idx + 2];

                // Luminance with contrast boost
                var brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                // Boost contrast
                brightness = brightness * 1.6;
                brightness = Math.min(1, Math.max(0, brightness));

                var charIdx = Math.floor(brightness * (chars.length - 1));
                output += chars[charIdx];
            }
            output += '\n';
        }

        asciiEl.textContent = output;
        requestAnimationFrame(renderFrame);
    }

    video.addEventListener('canplay', function() {
        requestAnimationFrame(renderFrame);
    });

    // Start immediately if already ready
    if (video.readyState >= 2) {
        requestAnimationFrame(renderFrame);
    }
})();
</script>
</body>
</html>
