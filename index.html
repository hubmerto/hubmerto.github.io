<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hubmerto</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            background: transparent;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }


        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .bg-video.loaded {
            opacity: 1;
        }

        .loader {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 200;
            width: 0;
            transition: width 0.3s ease, opacity 0.4s ease;
        }

        .loader.done {
            opacity: 0;
        }

        nav.loaded {
            opacity: 1;
        }

        @media (max-width: 600px) {
            nav { padding: 18px 20px; }
        }
    </style>
</head>
<body>

<div class="loader" id="loader"></div>

<video class="bg-video" autoplay muted loop playsinline>
    <source src="ascii-video.mp4" type="video/mp4">
</video>

<nav id="nav">
    <a href="/projects">projects</a>
    <a href="/contact">contact</a>
</nav>

<script>
(function() {
    var video = document.querySelector('.bg-video');
    var loader = document.getElementById('loader');
    var nav = document.getElementById('nav');
    var progress = 0;
    var interval;

    // Animate loader bar while video buffers
    interval = setInterval(function() {
        progress += (90 - progress) * 0.08;
        loader.style.width = progress + '%';
    }, 50);

    function reveal() {
        clearInterval(interval);
        loader.style.width = '100%';
        setTimeout(function() {
            loader.classList.add('done');
            video.classList.add('loaded');
            nav.classList.add('loaded');
        }, 300);
    }

    video.addEventListener('loadedmetadata', function() {
        var duration = video.duration;
        var now = (Date.now() / 1000) % duration;
        video.currentTime = now;
    });

    video.addEventListener('canplaythrough', reveal);

    // Fallback if video takes too long
    setTimeout(reveal, 8000);
})();
</script>
</body>
</html>
