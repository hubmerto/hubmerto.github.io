<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hubmerto</title>
    <link rel="preload" href="/bg.mp4" as="video" type="video/mp4">
    <link rel="preload" href="/projects/bg.mp4" as="video" type="video/mp4">
    <link rel="preload" href="/ascii-frames.json" as="fetch" type="application/json" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            background: transparent;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.disabled {
            color: #555;
            pointer-events: none;
        }

        #ascii-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #ascii-canvas.loaded {
            opacity: 1;
        }

        .loader {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 200;
            width: 0;
            transition: width 0.3s ease, opacity 0.4s ease;
        }

        .loader.done {
            opacity: 0;
        }

        nav.loaded {
            opacity: 1;
        }

        @media (max-width: 600px) {
            nav { padding: 18px 20px; }
        }
    </style>
</head>
<body>

<div class="loader" id="loader"></div>

<canvas id="ascii-canvas"></canvas>

<nav id="nav">
    <a class="disabled" href="/">home</a>
    <a href="/projects">projects</a>
    <a href="/contact">contact</a>
</nav>

<script>
(function() {
    var canvas = document.getElementById('ascii-canvas');
    var ctx = canvas.getContext('2d');
    var loader = document.getElementById('loader');
    var nav = document.getElementById('nav');
    var visited = sessionStorage.getItem('visited');
    var ASCII = ' .·:;~!¡†‡*+≠#%▓@█';
    var frameData = null;
    var currentFrame = 0;
    var animInterval = null;

    sessionStorage.setItem('visited', '1');

    // Start loading bar if first visit
    var progress = 0;
    var loadInterval = null;
    if (!visited) {
        loadInterval = setInterval(function() {
            progress += (90 - progress) * 0.08;
            loader.style.width = progress + '%';
        }, 50);
    } else {
        loader.style.display = 'none';
    }

    function reveal() {
        if (loadInterval) clearInterval(loadInterval);
        if (!visited) {
            loader.style.width = '100%';
            setTimeout(function() {
                loader.classList.add('done');
                canvas.classList.add('loaded');
                nav.classList.add('loaded');
            }, 300);
        } else {
            canvas.classList.add('loaded');
            nav.classList.add('loaded');
        }
    }

    function setupCanvas() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
    }

    // Measure monospace char aspect ratio once
    var charRatio = 0.6; // width/height for monospace fonts

    function drawFrame(idx) {
        if (!frameData) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        var dataCols = frameData.cols;
        var dataRows = frameData.rows;

        // Clear full canvas
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);

        // Lock aspect ratio: the grid's visual aspect is
        // (dataCols * charRatio) : dataRows (since charW = fontSize * charRatio, charH = fontSize)
        var gridAspect = (dataCols * charRatio) / dataRows;

        // object-fit: cover — scale so the grid covers the viewport
        var fontSize;
        if (w / h > gridAspect) {
            // Viewport is wider than grid — fit to width
            fontSize = w / (dataCols * charRatio);
        } else {
            // Viewport is taller than grid — fit to height
            fontSize = h / dataRows;
        }

        var charW = fontSize * charRatio;
        var charH = fontSize;
        var gridW = dataCols * charW;
        var gridH = dataRows * charH;
        var offsetX = (w - gridW) / 2;
        var offsetY = (h - gridH) / 2;

        ctx.font = fontSize + 'px Menlo, Monaco, Courier New, monospace';
        ctx.fillStyle = '#e0e0e0';
        ctx.textBaseline = 'top';

        var frame = frameData.frames[idx];

        for (var y = 0; y < dataRows; y++) {
            var line = '';
            for (var x = 0; x < dataCols; x++) {
                var c = frame[y * dataCols + x];
                var charIdx = c >= 'a' ? (c.charCodeAt(0) - 87) : parseInt(c);
                line += ASCII[charIdx];
            }
            ctx.fillText(line, offsetX, offsetY + y * charH);
        }
    }

    function startAnimation() {
        // Sync to time so all pages feel continuous
        var totalFrames = frameData.frames.length;
        var msPerFrame = frameData.fps;
        var totalDuration = totalFrames * msPerFrame;
        currentFrame = Math.floor(((Date.now()) % totalDuration) / msPerFrame);

        drawFrame(currentFrame);
        reveal();

        animInterval = setInterval(function() {
            currentFrame = (currentFrame + 1) % frameData.frames.length;
            drawFrame(currentFrame);
        }, msPerFrame);
    }

    setupCanvas();
    window.addEventListener('resize', function() {
        setupCanvas();
        if (frameData) drawFrame(currentFrame);
    });

    fetch('/ascii-frames.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            frameData = data;
            startAnimation();
        })
        .catch(function() {
            // Fallback: just show nav
            reveal();
        });

    // Timeout fallback
    setTimeout(function() {
        if (!frameData) reveal();
    }, 8000);
})();
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('dblclick', function(e) { e.preventDefault(); });
document.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 400);
        }
    });
});
</script>
</body>
</html>
