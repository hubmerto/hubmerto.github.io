<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hubmerto — contact</title>
    <meta name="description" content="Get in touch. Creative direction across web, code, and real-time worlds.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="hubmerto">
    <meta property="og:title" content="hubmerto · contact">
    <meta property="og:description" content="Get in touch. Creative direction across web, code, and real-time worlds.">
    <meta property="og:url" content="https://hubmerto.com/contact/">
    <meta property="og:image" content="https://hubmerto.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image" content="https://hubmerto.com/og-square.png">
    <meta property="og:image:width" content="630">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="hubmerto · contact">
    <meta name="twitter:description" content="Get in touch. Creative direction across web, code, and real-time worlds.">
    <meta name="twitter:image" content="https://hubmerto.com/og.png">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preload" href="/bg.mp4" as="video" type="video/mp4">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
    <link rel="prefetch" href="/ascii-frames.json" as="fetch" type="application/json" crossorigin>
    <link rel="prefetch" href="/projects/bg.mp4" as="video" type="video/mp4">
    <style>

        
        :root {
            --bg: #0a0a0a;
            --fg: #e0e0e0;
            --fg-strong: #ffffff;
            --fg-muted: #888;
            --fg-faint: #555;
        }
        [data-theme="light"] {
            --bg: #f5f5f3;
            --fg: #1a1a1a;
            --fg-strong: #000000;
            --fg-muted: #555;
            --fg-faint: #888;
        }
        .bg-video, .bg-video + * { z-index: 0; }
        [data-theme="light"] .bg-video { display: none; }
        .theme-toggle {
            appearance: none; background: transparent; border: none;
            color: var(--fg); cursor: pointer; padding: 0;
            margin-left: 4px; font-size: 18px; line-height: 1;
            width: 22px; height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-toggle:hover { color: var(--fg-strong); transform: rotate(180deg); }
* { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .content {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
        }

        nav {
            display: flex;
            gap: 24px;
            background: transparent;
        }

        nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--fg-strong);
        }

        nav a.disabled {
            color: var(--fg-faint);
            pointer-events: none;
        }


        /* Main content */
        main {
            padding: 0;
            max-width: 800px;
        }

        h1 {
            font-size: clamp(16px, 1.8vw, 20px);
            font-weight: 300;
            color: var(--fg-strong);
            line-height: 1.6;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .subtitle {
            font-size: clamp(13px, 1.4vw, 15px);
            color: var(--fg-muted);
            font-weight: 300;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        .skills {
            margin-bottom: 36px;
        }

        .skills p {
            font-size: clamp(12px, 1.4vw, 14px);
            color: var(--fg-muted);
            line-height: 1.8;
        }

        .contact-section h2 {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .contact-item {
            margin-bottom: 18px;
        }

        .contact-label {
            font-size: 12px;
            color: var(--fg-faint);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
        }

        .contact-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0;
            font-size: clamp(13px, 1.4vw, 15px);
            color: var(--fg);
            text-decoration: none;
            padding: 4px 8px;
            margin-left: -8px;
            border-radius: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        .contact-link:hover {
            background-color: var(--fg-strong);
            color: var(--bg);
        }

        /* Copy tooltip */
        .copy-tooltip {
            display: inline-block;
            overflow: hidden;
            max-width: 0;
            opacity: 0;
            white-space: nowrap;
            font-size: 11px;
            color: var(--fg-faint);
            transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.3s ease,
                        margin-left 0.3s ease;
            margin-left: 0;
        }

        .contact-item:hover .copy-tooltip {
            max-width: 160px;
            opacity: 1;
            margin-left: 8px;
        }

        .contact-link.copied {
            background-color: var(--fg-strong);
            color: var(--bg);
        }

        .contact-item.copied .copy-tooltip {
            max-width: 160px;
            opacity: 1;
            margin-left: 8px;
        }

        .contact-link.github:hover {
            background-color: var(--fg-strong);
            color: var(--bg);
        }

        /* Background video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            .page-header { padding: 18px 20px; }
            main { padding: 0; }
            nav { gap: 16px; }
        }
    </style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline preload="auto" poster="/poster.jpg">
    <source src="../bg.mp4" type="video/mp4">
</video>

<div class="content" id="content">
<div class="page-header">
<main>
    <h1>Humberto Gesser</h1>
    <p class="subtitle">Digital Artist and Creative Director</p>

    <div class="skills">
        <p>WebGPU/GL</p>
        <p>Interactive Motion Design</p>
        <p>Real-time Rendering</p>
        <p>Creative Coding</p>
        <p>TouchDesigner</p>
        <p>3D Art and Design</p>
    </div>

    <section id="contact" class="contact-section">
        <h2>Contact</h2>

        <div class="contact-item" id="email-item">
            <div class="contact-label">mail <span class="copy-tooltip" id="copy-tooltip">— copy to clipboard</span></div>
            <a class="contact-link" id="email-link" onclick="copyEmail(event)">
                design[at]hubmerto.com
            </a>
        </div>

        <div class="contact-item">
            <div class="contact-label">gitHub</div>
            <a class="contact-link github" href="https://github.com/hubmerto" target="_blank" rel="noopener">
                @hubmerto
            </a>
        </div>
    </section>
</main>

<nav>
    <a href="/">home</a>
    <a href="/projects">projects</a>
    <a class="disabled" href="/contact">contact</a>
</nav>
</div>
</div>

<script>
(function() {
    var video = document.querySelector('.bg-video');
    function tryPlay() {
        video.play().catch(function() {});
    }
    if (video.readyState >= 3) {
        tryPlay();
    } else {
        video.addEventListener('canplay', tryPlay, { once: true });
    }
    // Fallback: keep retrying every 500ms until playing
    var check = setInterval(function() {
        if (!video.paused) { clearInterval(check); return; }
        tryPlay();
    }, 500);
    setTimeout(function() { clearInterval(check); }, 10000);
})();

function copyEmail(e) {
    e.preventDefault();
    const email = 'design@hubmerto.com';
    navigator.clipboard.writeText(email).then(function() {
        const link = document.getElementById('email-link');
        const item = document.getElementById('email-item');
        const tooltip = document.getElementById('copy-tooltip');

        link.classList.add('copied');
        item.classList.add('copied');
        tooltip.textContent = '— copied!';

        setTimeout(function() {
            link.classList.remove('copied');
            item.classList.remove('copied');
            tooltip.textContent = '— copy to clipboard';
        }, 2000);
    });
}
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('dblclick', function(e) { e.preventDefault(); });
var content = document.getElementById('content');
content.offsetHeight;
content.style.opacity = '1';
document.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var href = a.getAttribute('href');
        if (href.startsWith('/') || href.startsWith('./')) {
            e.preventDefault();
            content.style.opacity = '0';
            setTimeout(function() { window.location.href = href; }, 400);
        }
    });
});
</script>

</body>
</html>
