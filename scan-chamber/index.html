<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scan Chamber</title>
<style>
  :root{ --accent:150,235,255; --steel:128,158,180; --pale:150,178,196; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#06080b; color:rgb(var(--pale)); -webkit-font-smoothing:antialiased; }
  body{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overscroll-behavior:none; }
  .app{ display:flex; height:100vh; height:100dvh; }
  .stage{ position:relative; flex:1; min-width:0; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #cv:active{ cursor:grabbing; }
  .fs{ position:absolute; top:14px; right:14px; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
       background:rgba(18,26,32,.55); border:.5px solid rgba(var(--steel),.3); border-radius:3px; color:rgba(var(--pale),.75);
       cursor:pointer; font-size:15px; line-height:1; user-select:none; }
  .fs:hover{ border-color:rgba(var(--accent),.6); color:rgb(var(--accent)); }

  .panel{ width:288px; flex:none; border-left:.5px solid rgba(var(--steel),.22); padding:22px 20px 26px; overflow:auto;
          display:flex; flex-direction:column; gap:22px; background:#070a0d; }
  .head h1{ margin:0; font-size:13px; letter-spacing:.34em; font-weight:600; color:rgba(var(--pale),.92); text-transform:uppercase; }
  .head p{ margin:6px 0 0; font-size:10.5px; letter-spacing:.1em; color:rgba(var(--pale),.42); text-transform:uppercase; }
  .blk{ display:flex; flex-direction:column; gap:9px; }
  .lab{ font-size:10px; letter-spacing:.2em; color:rgba(var(--pale),.45); text-transform:uppercase; display:flex; justify-content:space-between; }
  .lab b{ color:rgba(var(--accent),.85); font-weight:500; letter-spacing:.12em; }

  .seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .seg button{ flex:1; padding:8px 0; font:inherit; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
               background:rgba(18,26,32,.5); color:rgba(var(--pale),.6); border:.5px solid rgba(var(--steel),.25);
               border-radius:3px; cursor:pointer; transition:.12s; }
  .seg button:hover{ color:rgba(var(--pale),.9); }
  .seg button.on{ color:rgb(var(--accent)); border-color:rgba(var(--accent),.7); background:rgba(var(--accent),.07); }

  .sw{ display:flex; gap:8px; flex-wrap:wrap; }
  .sw button{ width:30px; height:30px; border-radius:50%; border:1.5px solid rgba(255,255,255,.12); cursor:pointer; padding:0;
              outline:none; transition:.12s; }
  .sw button.on{ border-color:#fff; box-shadow:0 0 0 2px rgba(var(--accent),.4); }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:2px; background:rgba(var(--steel),.3);
                     border-radius:2px; accent-color:rgb(var(--accent)); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
                     background:rgb(var(--accent)); cursor:pointer; border:none; }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:rgb(var(--accent)); cursor:pointer; border:none; }

  .scan-row{ display:flex; align-items:center; gap:12px; }
  #play{ width:34px; height:30px; flex:none; display:flex; align-items:center; justify-content:center;
         background:rgba(18,26,32,.6); border:.5px solid rgba(var(--steel),.3); border-radius:3px; color:rgba(var(--accent),.85);
         cursor:pointer; font-size:10px; letter-spacing:1px; }
  #play:hover{ border-color:rgba(var(--accent),.6); color:rgb(var(--accent)); }

  .foot{ margin-top:auto; font-size:9.5px; letter-spacing:.13em; color:rgba(var(--pale),.3); text-transform:uppercase; line-height:1.9; }

  @media(max-width:760px){
    .app{ flex-direction:column; }
    .stage{ height:56vh; flex:none; }
    .panel{ width:auto; border-left:0; border-top:.5px solid rgba(var(--steel),.22); flex:1; padding:18px 16px 30px; gap:18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="fs" id="fs" title="Fullscreen">⤢</div>
  </div>
  <aside class="panel">
    <div class="head">
      <h1>Scan Chamber</h1>
      <p>square-section torus · poloidal emitter</p>
    </div>

    <div class="blk">
      <div class="lab">Light mode</div>
      <div class="seg" id="seg">
        <button data-m="beams" class="on">Beams</button>
        <button data-m="single">Single</button>
        <button data-m="pulse">Pulse</button>
        <button data-m="curtain">Curtain</button>
        <button data-m="spots">Spots</button>
        <button data-m="sweep">Sweep</button>
        <button data-m="shimmer">Shimmer</button>
        <button data-m="drift">Drift</button>
        <button data-m="spray">Spray</button>
      </div>
    </div>

    <div class="blk">
      <div class="lab">Colour</div>
      <div class="sw" id="sw"></div>
    </div>

    <div class="blk">
      <div class="lab">Intensity <b id="ival">1.0</b></div>
      <input type="range" id="intensity" min="0.3" max="2" step="0.05" value="1">
    </div>

    <div class="blk">
      <div class="lab">Scan <b id="sval">000°</b></div>
      <div class="scan-row">
        <button id="play">▮▮</button>
        <input type="range" id="scan" min="0" max="6.2832" step="0.001" value="0">
      </div>
    </div>

    <div class="blk">
      <div class="lab">Scan speed</div>
      <input type="range" id="speed" min="0.15" max="2.2" step="0.05" value="1">
    </div>

    <div class="foot">
      drag to orbit<br>space to pause scan<br>single file · open anywhere
    </div>
  </aside>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var DPR=Math.min(window.devicePixelRatio||1,2);
  function size(){ DPR=Math.min(window.devicePixelRatio||1,2); cv.width=Math.round(cv.clientWidth*DPR); cv.height=Math.round(cv.clientHeight*DPR); }
  new ResizeObserver(size).observe(cv); size();

  var COLORS=[
    {n:'cyan',  b:[150,235,255], c:[215,248,255]},
    {n:'ice',   b:[214,228,240], c:[255,255,255]},
    {n:'acid',  b:[150,255,150], c:[226,255,226]},
    {n:'mag',   b:[255,120,220], c:[255,205,245]},
    {n:'red',   b:[255,52,52],   c:[255,176,168]},
    {n:'haz',   b:[255,120,55],  c:[255,205,160]},
    {n:'uv',    b:[168,128,255], c:[226,210,255]}
  ];

  var st={ phi:0, auto:true, speed:1, a:0.08, mode:'beams', col:0, intensity:1, spin:0.62, pit:0.95, tk:0 };

  // geometry constants
  var R=1.1, Nur=64, Bx=2.4, By=2.4, zf=-1.9, zc=1.9;
  var Lx=0.30, Ly=-0.45, Lz=0.84;
  var FN=[[0,0,-1],[0,0,1],[1,0,0],[-1,0,0],[0,1,0],[0,-1,0]];
  var crn=[[-Bx,-By,zf],[Bx,-By,zf],[Bx,By,zf],[-Bx,By,zf],[-Bx,-By,zc],[Bx,-By,zc],[Bx,By,zc],[-Bx,By,zc]];
  var edg=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  var fquad=[[0,1,2,3],[4,5,6,7],[1,2,6,5],[0,3,7,4],[3,2,6,7],[0,1,5,4]];

  var cx,cy,S,csz,ssz,cp,sp;
  function P(x,y,z){ var x1=x*csz-y*ssz,y1=x*ssz+y*csz; return [cx+x1*S, cy+(y1*cp-z*sp)*S, y1*sp+z*cp]; }
  function NV(x,y,z){ var x1=x*csz-y*ssz,y1=x*ssz+y*csz; return [x1, y1*cp-z*sp, y1*sp+z*cp]; }
  function rgba(a,al){ return 'rgba('+a[0]+','+a[1]+','+a[2]+','+al+')'; }

  function isect(ox,oy,oz,dx,dy,dz){
    var best=1e9,face=-1,t,u,v;
    if(dx>1e-9||dx<-1e-9){
      t=(Bx-ox)/dx; if(t>1e-4&&t<best){u=oy+t*dy;v=oz+t*dz; if(u>=-By-1e-3&&u<=By+1e-3&&v>=zf-1e-3&&v<=zc+1e-3){best=t;face=2;}}
      t=(-Bx-ox)/dx; if(t>1e-4&&t<best){u=oy+t*dy;v=oz+t*dz; if(u>=-By-1e-3&&u<=By+1e-3&&v>=zf-1e-3&&v<=zc+1e-3){best=t;face=3;}}
    }
    if(dy>1e-9||dy<-1e-9){
      t=(By-oy)/dy; if(t>1e-4&&t<best){u=ox+t*dx;v=oz+t*dz; if(u>=-Bx-1e-3&&u<=Bx+1e-3&&v>=zf-1e-3&&v<=zc+1e-3){best=t;face=4;}}
      t=(-By-oy)/dy; if(t>1e-4&&t<best){u=ox+t*dx;v=oz+t*dz; if(u>=-Bx-1e-3&&u<=Bx+1e-3&&v>=zf-1e-3&&v<=zc+1e-3){best=t;face=5;}}
    }
    if(dz>1e-9||dz<-1e-9){
      t=(zf-oz)/dz; if(t>1e-4&&t<best){u=ox+t*dx;v=oy+t*dy; if(u>=-Bx-1e-3&&u<=Bx+1e-3&&v>=-By-1e-3&&v<=By+1e-3){best=t;face=0;}}
      t=(zc-oz)/dz; if(t>1e-4&&t<best){u=ox+t*dx;v=oy+t*dy; if(u>=-Bx-1e-3&&u<=Bx+1e-3&&v>=-By-1e-3&&v<=By+1e-3){best=t;face=1;}}
    }
    if(face<0)return null;
    return [ox+best*dx,oy+best*dy,oz+best*dz,face];
  }

  function draw(){
    var w=cv.width,h=cv.height; cx=w/2; cy=h*0.5; S=Math.min(w,h)/6.1; st.tk++;
    csz=Math.cos(st.spin); ssz=Math.sin(st.spin); cp=Math.cos(st.pit); sp=Math.sin(st.pit);
    var phi=st.phi, cphi=Math.cos(phi), sphi=Math.sin(phi), a=st.a;
    var pulse=(0.82+0.18*Math.sin(st.tk*0.05))*st.intensity;
    var COL=COLORS[st.col], B=COL.b, C=COL.c;
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#06080b'; ctx.fillRect(0,0,w,h);

    // visible chamber surfaces
    var vis=[]; for(var i=0;i<6;i++){ var vn=NV(FN[i][0],FN[i][1],FN[i][2]); vis[i]=vn[2]<0; }
    var sfill=['#11161b','#0b0f13','#0b0f13','#0b0f13','#0b0f13','#0b0f13'];
    for(i=0;i<6;i++){ if(!vis[i])continue; var fq=fquad[i]; ctx.beginPath();
      for(var k=0;k<4;k++){ var q=P(crn[fq[k]][0],crn[fq[k]][1],crn[fq[k]][2]); if(k===0)ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]); }
      ctx.closePath(); ctx.fillStyle=sfill[i]; ctx.fill(); }
    if(vis[0]){ ctx.strokeStyle='rgba(95,125,150,0.11)'; ctx.lineWidth=0.75*DPR;
      for(var g=-Bx; g<=Bx+0.001; g+=0.4){ var A=P(g,-By,zf),Bp=P(g,By,zf); ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(Bp[0],Bp[1]); ctx.stroke();
        var Cc=P(-Bx,g,zf),D=P(Bx,g,zf); ctx.beginPath(); ctx.moveTo(Cc[0],Cc[1]); ctx.lineTo(D[0],D[1]); ctx.stroke(); } }

    // solid ring (cross-section rotated by phi)
    var faces=[[a,-a,a,a,1,0],[a,a,-a,a,0,1],[-a,a,-a,-a,-1,0],[-a,-a,a,-a,0,-1]];
    var items=[],dmin=1e9,dmax=-1e9;
    for(var f=0;f<faces.length;f++){ var fc=faces[f]; var nr=fc[4]*cphi-fc[5]*sphi,nz=fc[4]*sphi+fc[5]*cphi;
      for(i=0;i<Nur;i++){ var u0=i/Nur*6.28319,u1=(i+1)/Nur*6.28319,um=(u0+u1)/2;
        var pr0=fc[0]*cphi-fc[1]*sphi,pz0=fc[0]*sphi+fc[1]*cphi,pr1=fc[2]*cphi-fc[3]*sphi,pz1=fc[2]*sphi+fc[3]*cphi;
        var W=[[(R+pr0)*Math.cos(u0),(R+pr0)*Math.sin(u0),pz0],[(R+pr0)*Math.cos(u1),(R+pr0)*Math.sin(u1),pz0],[(R+pr1)*Math.cos(u1),(R+pr1)*Math.sin(u1),pz1],[(R+pr1)*Math.cos(u0),(R+pr1)*Math.sin(u0),pz1]];
        var s4=[],c0=0,c1=0,c2=0; for(k=0;k<4;k++){ var r=P(W[k][0],W[k][1],W[k][2]); s4.push([r[0],r[1]]); c0+=W[k][0];c1+=W[k][1];c2+=W[k][2]; }
        var cr=P(c0/4,c1/4,c2/4),d=cr[2]; var wn=NV(nr*Math.cos(um),nr*Math.sin(um),nz),diff=wn[0]*Lx+wn[1]*Ly+wn[2]*Lz; if(diff<0)diff=0;
        items.push({d:d,p:s4,c:'hsl(200,12%,'+Math.round(6+15*diff)+'%)'}); if(d<dmin)dmin=d; if(d>dmax)dmax=d; }
    }
    items.sort(function(A,B){return A.d-B.d;}); var span=(dmax-dmin)||1; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=0.75*DPR;
    for(i=0;i<items.length;i++){ var it=items[i],pp=it.p; ctx.beginPath(); ctx.moveTo(pp[0][0],pp[0][1]); ctx.lineTo(pp[1][0],pp[1][1]); ctx.lineTo(pp[2][0],pp[2][1]); ctx.lineTo(pp[3][0],pp[3][1]); ctx.closePath();
      ctx.fillStyle=it.c; ctx.fill(); var t=(it.d-dmin)/span; ctx.strokeStyle='rgba(150,180,200,'+(0.13+0.42*t).toFixed(3)+')'; ctx.stroke(); }

    // ---- emitted light ----
    ctx.globalCompositeOperation='lighter';

    // cast a ray from origin (ox,oy,oz) along unit dir (n0,n1,n2):
    // optional beam line + optional wall glint, all scaled by alpha `al`.
    function cast(ox,oy,oz,n0,n1,n2,al,lw,line,glow){
      var Hh=isect(ox,oy,oz,n0,n1,n2); if(!Hh)return;
      var A=P(ox,oy,oz),Bb=P(Hh[0],Hh[1],Hh[2]);
      if(line){ ctx.lineWidth=lw*DPR; ctx.strokeStyle=rgba(B,(0.20*pulse*al).toFixed(3));
        ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(Bb[0],Bb[1]); ctx.stroke(); }
      if(glow && vis[Hh[3]]){ var fn=FN[Hh[3]]; var ci=Math.abs(n0*fn[0]+n1*fn[1]+n2*fn[2]); var rad=(4+7*ci)*DPR;
        var gr=ctx.createRadialGradient(Bb[0],Bb[1],0,Bb[0],Bb[1],rad);
        gr.addColorStop(0,rgba(C,((0.30+0.5*ci)*pulse*Math.min(1,al)).toFixed(3))); gr.addColorStop(1,rgba(B,0));
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(Bb[0],Bb[1],rad,0,6.2832); ctx.fill(); }
    }
    // poloidal beam from toroidal angle u (cross-section offset s).
    function shoot(u,s,al,lw,line,glow){
      var ct=Math.cos(u),stt=Math.sin(u);
      var n0=sphi*ct,n1=sphi*stt,n2=-cphi, t0=cphi*ct,t1=cphi*stt,t2=sphi;
      cast(R*ct+a*n0+s*t0, R*stt+a*n1+s*t1, a*n2+s*t2, n0,n1,n2, al,lw,line,glow);
    }

    ctx.lineCap='round';
    if(st.mode==='beams'){            // dense — many beams per segment
      var Sray=3;
      for(var ti=0;ti<120;ti++){ var u=ti/120*6.28319;
        for(var sj=0;sj<Sray;sj++){ shoot(u,(-a)+(2*a)*(sj/(Sray-1)),1,0.9,true,sj===1); } }
    } else if(st.mode==='single'){     // one beam per ring segment
      for(var ti=0;ti<Nur;ti++){ shoot((ti+0.5)/Nur*6.28319,0,1.2,1.15,true,true); }
    } else if(st.mode==='pulse'){      // single beams, a brightness wave travelling around
      var headp=st.tk*0.045;
      for(var ti=0;ti<Nur;ti++){ var u=(ti+0.5)/Nur*6.28319; var w=0.5+0.5*Math.cos(u-headp); w*=w;
        shoot(u,0,0.22+1.25*w,1.15,true,w>0.5); }
    } else if(st.mode==='spots'){      // no beam lines — only the glints where light lands
      for(var ti=0;ti<Nur*2;ti++){ shoot((ti+0.5)/(Nur*2)*6.28319,0,1.3,1,false,true); }
    } else if(st.mode==='sweep'){      // a single beam-blade sweeping around with a comet trail
      var head=(st.tk*0.05)%6.28319;
      for(var k=0;k<22;k++){ var al=1-k/22; al=al*al*2.2; shoot(head-k*0.05,0,al,k<2?2:1.2,true,k<3); }
    } else if(st.mode==='shimmer'){    // each segment twinkles on its own scattered phase — one rhythm
      for(var ti=0;ti<Nur;ti++){ var tw=0.5+0.5*Math.sin(st.tk*0.06+ti*2.3998); tw*=tw;
        shoot((ti+0.5)/Nur*6.28319,0,0.15+1.5*tw,1.1,true,tw>0.45); }
    } else if(st.mode==='drift'){      // each streak sways around its home angle, phases scattered
      for(var ti=0;ti<Nur;ti++){ var u=(ti+0.5)/Nur*6.28319+0.11*Math.sin(st.tk*0.05+ti*2.3998);
        shoot(u,0,1.1,1.1,true,true); }
    } else if(st.mode==='spray'){      // each streak fans its direction in/out on its own phase
      for(var ti=0;ti<Nur;ti++){ var u=(ti+0.5)/Nur*6.28319, ct=Math.cos(u), stt=Math.sin(u);
        var n0=sphi*ct,n1=sphi*stt,n2=-cphi, t0=cphi*ct,t1=cphi*stt,t2=sphi;
        var wob=0.4*Math.sin(st.tk*0.05+ti*2.3998);
        var d0=n0+wob*t0,d1=n1+wob*t1,d2=n2+wob*t2, dl=Math.sqrt(d0*d0+d1*d1+d2*d2);
        cast(R*ct+a*n0,R*stt+a*n1,a*n2,d0/dl,d1/dl,d2/dl,1.05,1.1,true,true); }
    } else { // curtain
      var NuT=120; ctx.lineWidth=2.0*DPR; ctx.lineCap='round';
      var prev=null,prevH=null;
      for(var ci2=0; ci2<=NuT; ci2++){ var u=ci2/NuT*6.28319,ct=Math.cos(u),stt=Math.sin(u);
        var n0=sphi*ct,n1=sphi*stt,n2=-cphi;
        var Fx=R*ct+a*n0,Fy=R*stt+a*n1,Fz=a*n2;
        var Hh=isect(Fx,Fy,Fz,n0,n1,n2);
        var Fp=P(Fx,Fy,Fz), Hp=Hh?P(Hh[0],Hh[1],Hh[2]):null;
        if(prev && Hp && prevH){
          var tp0=NV(cphi*Math.cos(u),cphi*Math.sin(u),sphi); var grz=1-Math.abs(tp0[2]);
          ctx.fillStyle=rgba(B,(pulse*(0.07+0.22*grz)).toFixed(3));
          ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(Fp[0],Fp[1]); ctx.lineTo(Hp[0],Hp[1]); ctx.lineTo(prevH[0],prevH[1]); ctx.closePath(); ctx.fill();
          if(Hh && vis[Hh[3]]){ ctx.strokeStyle=rgba(C,(pulse*0.5).toFixed(3)); ctx.beginPath(); ctx.moveTo(prevH[0],prevH[1]); ctx.lineTo(Hp[0],Hp[1]); ctx.stroke(); }
        }
        prev=Fp; prevH=Hp;
      }
    }
    // faint bloom at emitter
    var rc0=P(0,0,0); var bg=ctx.createRadialGradient(rc0[0],rc0[1],0,rc0[0],rc0[1],(R+a)*S*1.3);
    bg.addColorStop(0,rgba(B,(0.06*pulse).toFixed(3))); bg.addColorStop(1,rgba(B,0)); ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='source-over';

    // chamber wireframe cage
    ctx.lineWidth=0.75*DPR;
    for(i=0;i<edg.length;i++){ var e=edg[i],A=P(crn[e[0]][0],crn[e[0]][1],crn[e[0]][2]),Bb=P(crn[e[1]][0],crn[e[1]][1],crn[e[1]][2]);
      var dd=((A[2]+Bb[2])/2); var ta=Math.max(0,Math.min(1,(dd+2.6)/5.2));
      ctx.strokeStyle='rgba(128,158,180,'+(0.12+0.4*ta).toFixed(3)+')'; ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(Bb[0],Bb[1]); ctx.stroke(); }

    // vignette
    var vg=ctx.createRadialGradient(cx,cy,Math.min(w,h)*0.32,cx,cy,Math.max(w,h)*0.72);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.58)'); ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);

    // HUD
    var pad=12*DPR,py=18*DPR,lh=14*DPR; ctx.textBaseline='alphabetic'; ctx.font=(10.5*DPR)+'px ui-monospace, Menlo, monospace';
    var deg=(((phi*57.2958)%360)+360)%360;
    ctx.fillStyle=rgba(B,0.78); ctx.fillText('SCAN  '+deg.toFixed(0).padStart(3,'0')+'\u00B0',pad,py);
    ctx.fillStyle='rgba(150,178,196,0.5)';
    ctx.fillText('MODE  '+st.mode.toUpperCase(),pad,py+lh);
    ctx.fillText('\u25A1 '+(2*a).toFixed(2)+'   R 1.10',pad,py+lh*2);
    ctx.fillText('ORTHO \u00B7 LOCKED',pad,h-12*DPR);
    ctx.strokeStyle=rgba(B,0.32); ctx.lineWidth=0.75*DPR; var rl=9*DPR;
    ctx.beginPath(); ctx.moveTo(rc0[0]-rl,rc0[1]); ctx.lineTo(rc0[0]-3*DPR,rc0[1]); ctx.moveTo(rc0[0]+3*DPR,rc0[1]); ctx.lineTo(rc0[0]+rl,rc0[1]);
      ctx.moveTo(rc0[0],rc0[1]-rl); ctx.lineTo(rc0[0],rc0[1]-3*DPR); ctx.moveTo(rc0[0],rc0[1]+3*DPR); ctx.lineTo(rc0[0],rc0[1]+rl); ctx.stroke();
    var m=16*DPR,o=10*DPR; ctx.strokeStyle='rgba(150,178,196,0.3)';
    function corner(x,y,sx,sy){ ctx.beginPath(); ctx.moveTo(x,y+sy*m); ctx.lineTo(x,y); ctx.lineTo(x+sx*m,y); ctx.stroke(); }
    corner(o,o,1,1); corner(w-o,o,-1,1); corner(o,h-o,1,-1); corner(w-o,h-o,-1,-1);
  }

  function loop(){ if(st.auto){ st.phi+=0.01*st.speed; if(st.phi>6.28319)st.phi-=6.28319; if(st.phi<0)st.phi+=6.28319; scan.value=st.phi; sval.textContent=((((st.phi*57.2958)%360)+360)%360).toFixed(0).padStart(3,'0')+'\u00B0'; } draw(); requestAnimationFrame(loop); }

  // ----- UI wiring -----
  var seg=document.getElementById('seg'), sw=document.getElementById('sw');
  var scan=document.getElementById('scan'), play=document.getElementById('play'), speed=document.getElementById('speed');
  var intensity=document.getElementById('intensity');
  var sval=document.getElementById('sval'), ival=document.getElementById('ival');

  function setAccent(){ var b=COLORS[st.col].b; document.documentElement.style.setProperty('--accent', b[0]+','+b[1]+','+b[2]); }
  // build swatches
  COLORS.forEach(function(c,idx){ var b=document.createElement('button'); b.style.background='rgb('+c.b[0]+','+c.b[1]+','+c.b[2]+')';
    if(idx===0)b.className='on'; b.title=c.n; b.addEventListener('click',function(){ st.col=idx;
      [].forEach.call(sw.children,function(x){x.classList.remove('on');}); b.classList.add('on'); setAccent(); }); sw.appendChild(b); });
  setAccent();

  seg.addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn)return; st.mode=btn.getAttribute('data-m');
    [].forEach.call(seg.children,function(x){x.classList.remove('on');}); btn.classList.add('on'); });

  scan.addEventListener('input',function(){ st.auto=false; st.phi=parseFloat(scan.value); play.textContent='\u25B6';
    sval.textContent=((((st.phi*57.2958)%360)+360)%360).toFixed(0).padStart(3,'0')+'\u00B0'; });
  function toggle(){ st.auto=!st.auto; play.textContent=st.auto?'\u25AE\u25AE':'\u25B6'; }
  play.addEventListener('click',toggle);
  speed.addEventListener('input',function(){ st.speed=parseFloat(speed.value); });
  intensity.addEventListener('input',function(){ st.intensity=parseFloat(intensity.value); ival.textContent=st.intensity.toFixed(1); });

  // orbit
  var drag=false,px=0,py=0;
  cv.addEventListener('pointerdown',function(e){ drag=true; px=e.clientX; py=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',function(e){ if(!drag)return; var dx=e.clientX-px,dy=e.clientY-py; px=e.clientX; py=e.clientY;
    st.spin+=dx*0.011; st.pit=Math.max(0.18,Math.min(1.5,st.pit-dy*0.009)); });
  cv.addEventListener('pointerup',function(){drag=false;});
  cv.addEventListener('pointercancel',function(){drag=false;});

  // keyboard
  window.addEventListener('keydown',function(e){ if(e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); toggle(); } });

  // fullscreen
  document.getElementById('fs').addEventListener('click',function(){ var s=document.querySelector('.stage');
    if(!document.fullscreenElement){ (s.requestFullscreen||s.webkitRequestFullscreen).call(s); } else { document.exitFullscreen(); } });

  loop();
})();
</script>
</body>
</html>
